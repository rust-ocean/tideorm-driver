[package]
name = "tideorm-driver-sqlite"
version = "0.1.1"
edition = "2021"
rust-version = "1.94"
description = "SQLite driver for TideORM, with a bundled SQLite"
license = "MIT"
repository = "https://github.com/rust-ocean/tideorm-driver"
readme = "../README.md"
keywords = ["database", "sqlite", "driver", "tideorm"]
categories = ["database"]

[lib]
name = "driver_sqlite"
path = "src/lib.rs"

[dependencies]
tideorm-driver-core = { version = "0.1.0", path = "../tideorm-driver-core" }
chrono = { version = "0.4.34", default-features = false, features = ["std", "clock"] }
flume = { version = "0.12.0", default-features = false, features = ["async"] }
futures-channel = { version = "0.3.32", default-features = false, features = ["sink", "alloc", "std"] }
futures-core = { version = "0.3.32", default-features = false }
futures-executor = "0.3.32"
futures-intrusive = "0.5.0"
futures-util = { version = "0.3.32", default-features = false, features = ["alloc", "sink"] }
libsqlite3-sys = { version = ">=0.30.1, <0.38.0", default-features = false, features = ["pkg-config", "vcpkg", "bundled", "unlock_notify"] }
percent-encoding = "2.3.0"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = { version = "2.0.18", default-features = false, features = ["std"] }
tracing = { version = "0.1.37", features = ["log"] }
url = "2.2.2"
uuid = "1.12.1"

[dev-dependencies]
# The doc examples call the driver through the front crate.
tideorm-driver = { path = "..", features = ["sqlite", "runtime-tokio"] }

[lints.clippy]
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
