[package]
name = "tideorm-driver-postgres"
version = "0.1.2"
edition = "2021"
rust-version = "1.94"
description = "PostgreSQL driver for TideORM"
license = "MIT"
repository = "https://github.com/rust-ocean/tideorm-driver"
readme = "../README.md"
keywords = ["database", "postgres", "driver", "tideorm"]
categories = ["database"]

[lib]
name = "driver_postgres"
path = "src/lib.rs"

[dependencies]
tideorm-driver-core = { version = "0.1.0", path = "../tideorm-driver-core" }
atoi = "2.0"
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
bitflags = { version = "2.4", default-features = false }
byteorder = { version = "1.4.3", default-features = false, features = ["std"] }
chrono = { version = "0.4.34", default-features = false, features = ["std", "clock"] }
futures-channel = { version = "0.3.32", default-features = false, features = ["sink", "alloc", "std"] }
futures-core = { version = "0.3.32", default-features = false }
futures-util = { version = "0.3.32", default-features = false, features = ["alloc", "sink", "io"] }
hex = "0.4.3"
hkdf = "0.13.0"
hmac = { version = "0.13.0", default-features = false }
itoa = "1.0.5"
log = "0.4.18"
md-5 = { version = "0.11.0", default-features = false }
memchr = { version = "2.5.0", default-features = false }
rand = { version = "0.10.1", default-features = false, features = ["thread_rng"] }
rust_decimal = { version = "1.36.0", default-features = false, features = ["std", "maths"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.142", features = ["raw_value"] }
sha2 = { version = "0.11.0", default-features = false }
smallvec = "1.13.1"
stringprep = "0.1.2"
thiserror = { version = "2.0.18", default-features = false, features = ["std"] }
tracing = { version = "0.1.37", features = ["log"] }
uuid = "1.12.1"
whoami = { version = "2.0.2", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
etcetera = "0.11.0"

[dev-dependencies]
# The doc examples call the driver through the front crate.
tideorm-driver = { path = "..", features = ["postgres", "runtime-tokio"] }

[lints.clippy]
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
